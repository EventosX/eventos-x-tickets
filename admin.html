<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos X - Panel Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --azul: #3b82f6; --fondo: #0a0a0a; --caja: #161616; --verde: #10b981; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fondo); color: white; margin: 0; padding: 20px; }
        
        /* Login */
        #login-screen { position: fixed; inset: 0; background: var(--fondo); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .input-pin { background: var(--caja); border: 1px solid #333; color: white; padding: 15px; border-radius: 12px; width: 100%; max-width: 320px; text-align: center; margin-bottom: 20px; font-size: 14px; box-sizing: border-box; }
        .input-pin:focus { outline: none; border-color: var(--azul); }
        .btn-pin { background: var(--azul); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; max-width: 320px; text-transform: uppercase; transition: 0.3s; box-sizing: border-box; }

        /* Panel Principal */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        h1 span { color: var(--azul); }
        
        .btn-refresh { background: #222; color: #fff; border: 1px solid #444; padding: 10px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
        .btn-refresh:hover { background: #333; border-color: var(--azul); color: var(--azul); }
        .btn-logout { background: transparent; color: #888; border: 1px solid #444; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .btn-logout:hover { background: #ef4444; color: white; border-color: #ef4444; }

        .ticket-card { background: var(--caja); border: 1px solid #333; border-radius: 15px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .ticket-info h3 { margin: 0 0 5px 0; color: #fff; font-size: 18px; }
        .ticket-info p { margin: 0; color: #888; font-size: 14px; }
        .badge-tipo { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; background: #333; margin-top: 12px; }
        
        .action-buttons { display: flex; gap: 10px; align-items: center; }
        .btn-aprobar { background: var(--verde); color: #000; border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 13px; }
        .btn-aprobar:hover { background: #059669; color: white; }
        .btn-rechazar { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.3s; }
        .btn-rechazar:hover { background: rgba(239, 68, 68, 0.1); }

        /* --- RESPONSIVE DESIGN (ADAPTACIÓN A CELULARES) --- */
        @media (max-width: 650px) {
            /* Apilamos el encabezado */
            .header { flex-direction: column; align-items: stretch; gap: 15px; }
            .header-left { justify-content: space-between; width: 100%; }
            .header > div:last-child { justify-content: space-between; width: 100%; }
            
            /* Apilamos la información y los botones de la tarjeta */
            .ticket-card { flex-direction: column; align-items: stretch; gap: 15px; }
            .action-buttons { flex-direction: column; width: 100%; margin-top: 5px; }
            .btn-aprobar, .btn-rechazar { width: 100%; box-sizing: border-box; text-align: center; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="margin-bottom: 20px;">ADMIN <span>X</span></h1>
        <p style="color: #888; font-size: 13px; margin-bottom: 25px; text-align: center; max-width: 300px;">Ingresá el PIN de Finanzas para continuar.</p>
        
        <input type="password" id="pinInput" class="input-pin" placeholder="PIN de Seguridad">
        <button class="btn-pin" id="btn-login" onclick="checkPin()">Conectar y Acceder</button>
    </div>

    <div id="main-interface" style="display: none; max-width: 900px; margin: 0 auto;">
        <div class="header">
            <div class="header-left">
                <button class="btn-refresh" onclick="cargarTodo()">↻ Refrescar</button>
                <h1>ADMIN <span>X</span></h1>
            </div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <div style="color: #888; font-size: 15px;">Pendientes: <span id="contador-pendientes" style="color: white; font-weight: bold; font-size: 18px;">0</span></div>
                <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>

        <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; background:#111; border:1px solid #222; border-radius:12px; padding:14px 18px; margin-bottom:20px;">
            <div style="color:#888; font-size:14px;">
                📧 Mails — en cola: <b id="mails-pendientes" style="color:#fff;">0</b>
                · enviados: <b id="mails-enviados" style="color:#10b981;">0</b>
                · con error: <b id="mails-errores" style="color:#ef4444;">0</b>
            </div>
            <div style="display:flex; gap:8px;">
                <input type="text" id="dni-reenvio" placeholder="DNI para reenviar QR" maxlength="8" inputmode="numeric"
                       oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                       style="padding:10px; background:#161616; border:1px solid #222; color:#fff; border-radius:8px; width:170px;">
                <button class="btn-refresh" onclick="reenviarQR()">Reenviar QR</button>
            </div>
        </div>

        <div id="lista-pendientes"></div>
    </div>

    <script>
        const supabaseUrl = 'https://vogizootbnhvbeugroyr.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvZ2l6b290Ym5odmJldWdyb3lyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MzY3MTAsImV4cCI6MjA5MDIxMjcxMH0.7dNueBWtcx0nUHjligZl4hS72qqlswuYw0WYR0QeVhI';
        const client = window.supabase.createClient(supabaseUrl, supabaseKey);

        // El PIN se guarda solo mientras la pestaña está abierta (no queda en el navegador)
        const getPin = () => sessionStorage.getItem('pin_admin_x');

        // Evita que un nombre "malicioso" cargado en el formulario ejecute código acá
        const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        let pendientesCache = [];

        window.onload = async () => {
            localStorage.removeItem('pin_admin_x'); // limpia el PIN viejo guardado
            if (getPin()) {
                const { error } = await client.rpc('get_pendientes', { pin_seguridad: getPin() });
                if (!error) iniciarPanel();
                else sessionStorage.removeItem('pin_admin_x');
            }
            document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });
        };

        async function checkPin() {
            const inputVal = document.getElementById('pinInput').value.trim();
            const btn = document.getElementById('btn-login');
            if (!inputVal) return;

            btn.innerText = "Verificando...";
            btn.disabled = true;
            btn.style.opacity = "0.5";

            const { error } = await client.rpc('get_pendientes', { pin_seguridad: inputVal });

            if (error) {
                alert("❌ PIN INCORRECTO. Acceso denegado.");
                document.getElementById('pinInput').value = "";
                btn.innerText = "Conectar y Acceder";
                btn.disabled = false;
                btn.style.opacity = "1";
            } else {
                sessionStorage.setItem('pin_admin_x', inputVal);
                iniciarPanel();
            }
        }

        function iniciarPanel() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-interface').style.display = 'block';
            cargarTodo();
            setInterval(cargarEstadoMails, 15000); // el contador de mails se actualiza solo
        }

        function cerrarSesion() {
            sessionStorage.removeItem('pin_admin_x');
            location.reload();
        }

        function cargarTodo() { cargarPendientes(); cargarEstadoMails(); }

        async function cargarEstadoMails() {
            const { data, error } = await client.rpc('get_estado_mails', { pin_seguridad: getPin() });
            if (error || !data) return;
            document.getElementById('mails-pendientes').innerText = data.pendientes;
            document.getElementById('mails-enviados').innerText = data.enviados;
            document.getElementById('mails-errores').innerText = data.errores;
        }

        async function cargarPendientes() {
            const lista = document.getElementById('lista-pendientes');
            const btnRefresh = document.querySelector('.btn-refresh');

            btnRefresh.innerText = "Cargando...";
            btnRefresh.style.opacity = "0.5";
            lista.innerHTML = "<p style='text-align:center; color:#888;'>Buscando reservas...</p>";

            const { data, error } = await client.rpc('get_pendientes', { pin_seguridad: getPin() });

            btnRefresh.innerText = "↻ Refrescar";
            btnRefresh.style.opacity = "1";

            if (error) {
                lista.innerHTML = "<p style='text-align:center; color:#ef4444;'>❌ Sesión expirada o error de conexión.</p>";
                return;
            }

            pendientesCache = data;
            document.getElementById('contador-pendientes').innerText = data.length;

            if (data.length === 0) {
                lista.innerHTML = "<p style='text-align:center; color:#888; margin-top: 40px; font-size: 18px;'>No hay reservas pendientes de pago. Todo al día. ✅</p>";
                return;
            }

            lista.innerHTML = data.map(entrada => {
                const isVIP = (entrada.tipo_entrada || '').includes('VIP');
                const colorBadge = isVIP ? 'background:#eab308; color:#000;' : 'background:#333; color:#fff;';

                let fechaFormateada = "Fecha no disponible";
                if (entrada.created_at) {
                    const fechaObj = new Date(entrada.created_at);
                    const fechaStr = fechaObj.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    const horaStr = fechaObj.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
                    fechaFormateada = `${fechaStr} a las ${horaStr} hs`;
                }

                return `
                    <div class="ticket-card" id="card-${esc(entrada.id)}">
                        <div class="ticket-info">
                            <h3>${esc(entrada.nombre)} ${esc(entrada.apellido)}</h3>
                            <p style="margin-bottom: 4px;">DNI: ${esc(entrada.dni)} | Email: ${esc(entrada.email)}</p>
                            <p style="color: #666; font-size: 13px; font-weight: bold;">🕒 Solicitado: ${fechaFormateada}</p>
                            <span class="badge-tipo" style="${colorBadge}">${esc(entrada.tipo_entrada)}</span>
                        </div>
                        <div class="action-buttons">
                            <button class="btn-aprobar" data-id="${esc(entrada.id)}" onclick="aprobarPago(this.dataset.id)">Aprobar y Enviar QR</button>
                            <button class="btn-rechazar" data-id="${esc(entrada.id)}" onclick="rechazarReserva(this.dataset.id)">Borrar</button>
                        </div>
                    </div>`;
            }).join('');
        }

        async function aprobarPago(id) {
            const btn = document.querySelector(`#card-${CSS.escape(id)} .btn-aprobar`);
            btn.innerText = "Aprobando...";
            btn.disabled = true;

            // Primero se aprueba en la base. Si sale bien, la base pone el mail con el QR en la cola
            // y el servidor lo envía solo (no depende de que esta pestaña quede abierta).
            const { error } = await client.rpc('aprobar_ticket', { ticket_id: id, pin_seguridad: getPin() });

            if (error) {
                alert("Error al aprobar: " + error.message);
                btn.innerText = "Aprobar y Enviar QR";
                btn.disabled = false;
                return;
            }

            document.getElementById(`card-${id}`).remove();
            const contador = document.getElementById('contador-pendientes');
            contador.innerText = Math.max(0, parseInt(contador.innerText) - 1);
            cargarEstadoMails();
        }

        async function rechazarReserva(id) {
            if (!confirm("¿Seguro que querés borrar esta reserva? Liberará el cupo de la entrada.")) return;
            const { error } = await client.rpc('borrar_ticket', { ticket_id: id, pin_seguridad: getPin() });
            if (error) alert("Error al borrar: " + error.message);
            cargarPendientes();
        }

        async function reenviarQR() {
            const dni = document.getElementById('dni-reenvio').value.trim();
            if (dni.length !== 8) return alert("⚠️ Ingresá un DNI de 8 números.");
            const { data, error } = await client.rpc('reenviar_qr', { p_dni: dni, pin_seguridad: getPin() });
            if (error) return alert("❌ " + error.message);
            alert(`✅ QR puesto en cola para ${data}. Sale en menos de 1 minuto.`);
            document.getElementById('dni-reenvio').value = "";
            cargarEstadoMails();
        }
    </script>
</body>
</html>
